
name: Build KIKO AI APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build KIKO AI APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure Environment Template Exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/.env.example" ]; then
            echo "# KIKO AI environment template" > "$GITHUB_WORKSPACE/.env.example"
          fi
          echo "Environment template verified"
          ls -la "$GITHUB_WORKSPACE/.env.example"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK Manager
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "SDK Manager not found!"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> $GITHUB_ENV
          echo "$(dirname "$SDKMANAGER")" >> $GITHUB_PATH

      - name: Accept Android Licenses
        run: |
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Install Android SDK
        run: |
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build KIKO AI
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KIKO-AI-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
          
